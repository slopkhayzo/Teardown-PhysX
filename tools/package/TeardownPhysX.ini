; Teardown-PhysX settings. Lines starting with ; are comments; the values below are the defaults (without this file the
; plugin uses the same). Restart the game after a change.

[PhysX]
; 3: NVIDIA PhysX simulates the game's free debris. 0: off, the game's own physics as usual.
Shadow=3
; 1: PhysX runs on the GPU when it can (an NVIDIA GeForce GTX 16 / RTX 20 or newer, with a driver for CUDA 12.8 or
; newer: version 570 or newer), otherwise on the CPU. 0: always on the CPU.
Gpu=1
; PhysX's threads on the CPU. 0: the number of logical processors minus 4, at least 2.
Threads=0
; 1: small debris collides with other debris and moving objects, so it piles up. 0: as in the game, where small
; pieces fall through other debris and only land on the level (cheaper, flatter piles).
SmallDebrisCollide=1
; PhysX collisions make the game's impact sounds (Impacts) and break voxels as the game's own do (Damage).
Impacts=1
Damage=1

[Fix]
; 1: the game deletes no small debris. Its own cleanup removes small pieces at rest unless they are within 5 m of you,
; or within 30 m and in view. 0: the game's cleanup.
KeepDebris=1
; Faster versions of engine routines (destruction bookkeeping, visibility checks). 0 turns one off.
TouchCache=1
StaticBodyUpdate=1
VisibleEarlyOut=1

[Tool]
; The debris tool: while the key is held, it cuts what you aim at into pieces (a quick way to make piles). Key: mmb
; (middle mouse button), xbutton1, xbutton2, a letter or a digit. The key then does this in every level.
Enabled=0
Key=mmb

[Trace]
; Diagnostics for bug reports: a timing trace and statistics in a new folder per session (gigabytes per hour of play).
Enabled=0
